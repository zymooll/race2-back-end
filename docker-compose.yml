# race3（大创）独立环境：容器名 / 主机端口 / 数据卷均与旧项目 race 隔离，两套可并行运行
services:
  mysql:
    image: mysql:8.0
    container_name: race3-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: race123456
      MYSQL_DATABASE: race
      TZ: Asia/Shanghai
    ports:
      # 仅绑定本机回环地址，避免 MySQL 端口暴露到公网（backend 容器走 Docker 内网访问 mysql:3306）
      # ⚠️ 主机 3306 已被旧项目 race 占用，本环境改用 3307
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prace123456"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: .
    container_name: race3-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 使用容器内 MySQL（连接串中主机名为 mysql 服务名）
      # 以下变量均可通过同目录 .env 覆盖（如 JWT_SECRET_KEY=xxx、CORS_ORIGINS=https://xx.pages.dev）
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:race123456@mysql:3306/race?charset=utf8mb4}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-me-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AUTO_TRAIN_ON_STARTUP: ${AUTO_TRAIN_ON_STARTUP:-true}
      SEED_SAMPLES: ${SEED_SAMPLES:-3000}
      # 运行环境：production 时 FastAPI 关闭 /docs、/redoc（生产不暴露接口契约）
      ENV: ${ENV:-development}
      # 行为验证码服务（compose 内网服务名）
      CAPTCHA_SERVICE_URL: ${CAPTCHA_SERVICE_URL:-http://go-captcha-service:8080}
      # AI 复核默认关闭；仅通过后端环境变量传入密钥
      AI_REVIEW_ENABLED: ${AI_REVIEW_ENABLED:-false}
      AI_REVIEW_NAMESPACE: ${AI_REVIEW_NAMESPACE:-main}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      AI_REVIEW_CONCURRENCY: ${AI_REVIEW_CONCURRENCY:-2}
      AI_REVIEW_IDLE_TIMEOUT: ${AI_REVIEW_IDLE_TIMEOUT:-30}
      AI_REVIEW_TOTAL_TIMEOUT: ${AI_REVIEW_TOTAL_TIMEOUT:-90}
      AI_REVIEW_LEASE_SECONDS: ${AI_REVIEW_LEASE_SECONDS:-120}
      AI_REVIEW_RETRY_COOLDOWN: ${AI_REVIEW_RETRY_COOLDOWN:-60}
      AI_REVIEW_MAX_OUTPUT_TOKENS: ${AI_REVIEW_MAX_OUTPUT_TOKENS:-2048}
    ports:
      # ⚠️ 与旧项目 race 的 8000 端口隔离
      # 注意：8001 会被 Windows 系统保留导致绑定失败（权限错误），故改用 18001
      - "18001:8000"
    volumes:
      - model_data:/app/data/models
      - sample_data:/app/data/samples

  # 行为验证码服务（go-captcha-service，官方 Go 服务）：仅回环绑定，不暴露公网
  # 注意：镜像 1.0.5 自带健康检查是坏的（CMD-SHELL 但镜像无 /bin/sh，且 -health-check
  # 参数必失败），服务本身功能正常 → 显式禁用健康检查，容器显示 running 而非 unhealthy
  go-captcha-service:
    image: wenlng/go-captcha-service:1.0.5
    container_name: race3-gocaptcha
    restart: unless-stopped
    healthcheck:
      disable: true
    ports:
      # ⚠️ 与旧项目 race 的 9090 端口隔离
      # 注意：9091 落在 Windows 保留端口段（9082-9181）无法绑定，故改用 19091
      # 后端容器走内网 http://go-captcha-service:8080 访问，此映射仅本机调试用
      - "127.0.0.1:19091:8080"

# 数据卷显式命名：与旧项目 race 的 back-end_* 前缀卷完全隔离，互不覆盖
volumes:
  mysql_data:
    name: race3_mysql_data
  model_data:
    name: race3_model_data
  sample_data:
    name: race3_sample_data
