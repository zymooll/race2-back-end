name: Deploy to Server

on:
  push:
    # main 与 dev 均自动部署；分支名经受限密钥传给 /root/deploy-backend.sh
    branches: [main, dev]
    # 仅后端相关文件变化时触发部署（文档/无关改动不触发）
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'admin-web/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - 'requirements*.txt'
      - '.github/workflows/deploy.yml'
  # 支持在 GitHub Actions 页面手动选择分支触发部署
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          # 服务器侧该密钥被 command= 限制为只执行 /root/deploy-backend.sh
          # 分支名经 SSH_ORIGINAL_COMMAND 传入，脚本内解析并校验（仅 main/dev）
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            deploy-backend.sh ${{ github.ref_name }}
